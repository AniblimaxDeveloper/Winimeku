name: Build Winimeku APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Build User App (Wibinime)
        run: |
          cd user_app
          flutter pub get
          flutter build apk --release

      - name: Build Admin App (Wibinime Admin)
        run: |
          cd admin_app
          flutter pub get
          flutter build apk --release

      - name: Upload Both APKs
        uses: actions/upload-artifact@v4
        with:
          name: Winimeku-APKs
          path: |
            user_app/build/app/outputs/flutter-apk/app-release.apk
            admin_app/build/app/outputs/flutter-apk/app-release.apk
