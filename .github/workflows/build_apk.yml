name: Build Winimeku APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # ==========================================
      # BUILD APLIKASI 1: ANIME (USER APP)
      # ==========================================
      - name: Build User App (Wibinime)
        run: |
          cd user_app
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Wibinime-User.apk

      - name: Upload User App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wibinime-User-App
          path: user_app/build/app/outputs/flutter-apk/Wibinime-User.apk

      # ==========================================
      # BUILD APLIKASI 2: PANEL ADMIN (ADMIN APP)
      # ==========================================
      - name: Build Admin App (Wibinime Admin)
        run: |
          cd admin_app
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Wibinime-Admin.apk

      - name: Upload Admin App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wibinime-Admin-App
          path: admin_app/build/app/outputs/flutter-apk/Wibinime-Admin.apk

      # ==========================================
      # UPLOAD KE GITHUB RELEASES (OPSIONAL TAPI DISARANKAN)
      # ==========================================
      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Release v1.0.0
          files: |
            user_app/build/app/outputs/flutter-apk/Wibinime-User.apk
            admin_app/build/app/outputs/flutter-apk/Wibinime-Admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
